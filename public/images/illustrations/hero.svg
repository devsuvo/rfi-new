<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf0ff"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a66ff"/>
      <stop offset="1" stop-color="#1b2fb8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b1b3f" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- desk -->
  <ellipse cx="260" cy="356" rx="210" ry="20" fill="#0b1b3f" fill-opacity=".18"/>

  <!-- book -->
  <g filter="url(#sh)" transform="translate(-34 0)">
    <rect x="120" y="92" width="170" height="250" rx="12" fill="url(#book)"/>
    <rect x="276" y="98" width="20" height="240" rx="6" fill="#f3f5fb"/>
    <rect x="120" y="92" width="18" height="250" rx="8" fill="#0b1b3f" fill-opacity=".18"/>
    <text x="156" y="174" fill="#fff" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" textLength="104" lengthAdjust="spacingAndGlyphs">IELTS</text>
    <rect x="156" y="196" width="96" height="5" rx="2.5" fill="#fff" fill-opacity=".55"/>
    <rect x="156" y="212" width="74" height="5" rx="2.5" fill="#fff" fill-opacity=".55"/>
    <rect x="156" y="228" width="84" height="5" rx="2.5" fill="#fff" fill-opacity=".55"/>
    <rect x="156" y="262" width="40" height="6" rx="3" fill="#e2263c"/>
  </g>

  <!-- headphones -->
  <g filter="url(#sh)" transform="translate(20 0)">
    <path d="M300 240v-44c0-48 38-86 86-86s86 38 86 86v44" stroke="url(#phone)" stroke-width="20" stroke-linecap="round"/>
    <path d="M300 236v-40c0-48 38-86 86-86" stroke="#1d5bff" stroke-width="7" stroke-linecap="round" stroke-opacity=".9"/>
    <rect x="276" y="224" width="58" height="104" rx="26" fill="url(#phone)"/>
    <rect x="438" y="224" width="58" height="104" rx="26" fill="url(#phone)"/>
    <ellipse cx="305" cy="276" rx="14" ry="34" fill="#1d5bff" fill-opacity=".85"/>
    <ellipse cx="467" cy="276" rx="14" ry="34" fill="#1d5bff" fill-opacity=".85"/>
  </g>

  <!-- plant -->
  <g transform="translate(-20 0)">
    <path d="M70 330c0-40 6-70 20-96" stroke="#2f9e5b" stroke-width="5" stroke-linecap="round"/>
    <path d="M90 236c-26-6-44-26-46-50 26 4 44 22 46 50z" fill="#3fbf6f"/>
    <path d="M86 268c22-10 44-8 60 6-22 10-42 8-60-6z" fill="#2f9e5b"/>
    <path d="M76 292c-22-4-38-18-42-38 22 2 38 16 42 38z" fill="#4fd17f"/>
    <rect x="46" y="320" width="56" height="40" rx="10" fill="#e2263c"/>
  </g>

  <!-- chat bubble -->
  <g filter="url(#sh)">
    <rect x="378" y="40" width="110" height="62" rx="18" fill="#fff"/>
    <path d="M404 100l-6 20 22-18z" fill="#fff"/>
    <circle cx="410" cy="71" r="6" fill="#1d5bff"/>
    <circle cx="433" cy="71" r="6" fill="#1d5bff" fill-opacity=".6"/>
    <circle cx="456" cy="71" r="6" fill="#1d5bff" fill-opacity=".3"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffd43b">
    <path d="M70 70l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M330 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill-opacity=".8"/>
  </g>
  <circle cx="480" cy="170" r="7" fill="#e2263c" fill-opacity=".3"/>
</svg>
