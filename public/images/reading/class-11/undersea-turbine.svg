<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111">
  <rect width="500" height="460" fill="#fff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111"/></marker>
    <g id="fish"><path d="M0 0 C8 -8 24 -8 30 0 C24 8 8 8 0 0 Z" fill="#fff" stroke="#111" stroke-width="1.2"/><path d="M30 0 L40 -7 L40 7 Z" fill="#fff" stroke="#111" stroke-width="1.2"/><circle cx="7" cy="-1.5" r="1.3"/><path d="M12 -5 L12 5 M17 -5 L17 5" stroke="#111" stroke-width=".6"/></g>
  </defs>

  <text x="250" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold">An Undersea Turbine</text>

  <!-- 23 -->
  <text x="40" y="64">Whole tower can be raised</text>
  <text x="40" y="88">for</text>
  <line x1="82" y1="90" x2="162" y2="90" stroke="#999" stroke-dasharray="1.5 2.5"/>
  <text x="168" y="88">and the extraction</text>
  <text x="40" y="112">of seaweed from the blades</text>
  <line x1="110" y1="120" x2="162" y2="178" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>

  <!-- scene -->
  <rect x="150" y="135" width="300" height="225" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="151" y="196" width="298" height="163" fill="#eaf4fb"/>
  <line x1="150" y1="196" x2="450" y2="196" stroke="#111" stroke-width="1.3"/>
  <g fill="none" stroke="#6a8ca6" stroke-width="1">
    <path d="M160 212 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0"/>
    <path d="M330 222 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0"/>
    <path d="M165 300 q10 -5 20 0 t20 0 t20 0"/>
    <path d="M360 310 q10 -5 20 0 t20 0 t20 0 t20 0"/>
    <path d="M170 340 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
  </g>
  <!-- brace: raisable part -->
  <path d="M186 158 q-8 0 -8 8 v28 q0 6 -6 6 q6 0 6 6 v28 q0 8 8 8" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- tower -->
  <rect x="290" y="118" width="16" height="242" fill="#555" stroke="#111"/>
  <rect x="294" y="118" width="3" height="242" fill="#999"/>
  <rect x="286" y="182" width="24" height="8" fill="#333"/>
  <path d="M298 96 l4 12 l12 -6 l-6 12 l12 4 l-12 4 l6 12 l-12 -6 l-4 12 l-4 -12 l-12 6 l6 -12 l-12 -4 l12 -4 l-6 -12 l12 6 z" fill="#ccc" stroke="#111"/>
  <!-- turbines -->
  <line x1="248" y1="275" x2="350" y2="262" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <g fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="3 2">
    <ellipse cx="248" cy="275" rx="30" ry="50"/>
    <ellipse cx="350" cy="262" rx="30" ry="50"/>
  </g>
  <g stroke="#111" stroke-width="5" stroke-linecap="round">
    <path d="M248 275 L240 232 M248 275 L276 300 M248 275 L222 305"/>
    <path d="M350 262 L358 219 M350 262 L322 285 M350 262 L376 292"/>
  </g>
  <circle cx="248" cy="275" r="5" fill="#fff" stroke="#111"/>
  <circle cx="350" cy="262" r="5" fill="#fff" stroke="#111"/>
  <!-- bubbles -->
  <g fill="#fff" stroke="#111" stroke-width=".8">
    <circle cx="226" cy="250" r="2.5"/><circle cx="220" cy="238" r="2"/><circle cx="228" cy="226" r="1.6"/><circle cx="214" cy="262" r="2.2"/>
    <circle cx="372" cy="240" r="2.5"/><circle cx="380" cy="228" r="2"/><circle cx="374" cy="216" r="1.6"/><circle cx="384" cy="252" r="2.2"/>
  </g>
  <!-- fish -->
  <use href="#fish" x="168" y="250"/>
  <use href="#fish" x="215" y="215"/>
  <use href="#fish" transform="translate(440 310) scale(-1 1)"/>
  <use href="#fish" transform="translate(425 330) scale(-1 1)"/>

  <!-- 25 / 26 -->
  <line x1="110" y1="388" x2="222" y2="300" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="40" y="400">Air bubbles result from</text>
  <text x="40" y="424">the</text>
  <line x1="86" y1="426" x2="166" y2="426" stroke="#999" stroke-dasharray="1.5 2.5"/>
  <text x="172" y="424">behind blades.</text>
  <text x="40" y="448">This is known as</text>
  <line x1="170" y1="450" x2="250" y2="450" stroke="#999" stroke-dasharray="1.5 2.5"/>

  <!-- 24 -->
  <line x1="372" y1="384" x2="400" y2="320" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="290" y="400">Sea life not in danger due to the</text>
  <text x="290" y="424">fact that blades are comparatively</text>
  <line x1="310" y1="450" x2="390" y2="450" stroke="#999" stroke-dasharray="1.5 2.5"/>
</svg>
