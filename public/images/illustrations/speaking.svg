      <stop offset="1" stop-color="#dcd9ff"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5dff"/>
      <stop offset="1" stop-color="#4433e0"/>
