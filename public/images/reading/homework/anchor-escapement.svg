<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111">
  <rect width="800" height="730" fill="#fff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111"/></marker>
    <radialGradient id="bob" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#999"/><stop offset="1" stop-color="#222"/></radialGradient>
  </defs>
  <text x="30" y="42" font-size="23" font-weight="bold">How the 1670 lever-based device worked</text>

  <!-- arbor from pivot to anchor -->
  <line x1="330" y1="165" x2="480" y2="210" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <circle cx="330" cy="165" r="11" fill="#444" stroke="#111"/>
  <circle cx="330" cy="165" r="4" fill="#fff"/>
  <!-- crutch -->
  <line x1="336" y1="170" x2="336" y2="300" stroke="#111" stroke-width="2"/>
  <circle cx="336" cy="302" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- pendulum -->
  <rect x="324" y="230" width="10" height="320" fill="#666" stroke="#111"/>
  <g fill="none" stroke="#111" stroke-dasharray="4 4">
    <ellipse cx="320" cy="605" rx="70" ry="62" transform="rotate(-15 320 605)"/>
    <ellipse cx="340" cy="605" rx="70" ry="62" transform="rotate(15 340 605)"/>
  </g>
  <ellipse cx="330" cy="605" rx="48" ry="56" fill="url(#bob)" stroke="#111" stroke-width="1.5"/>
  <path d="M292 682 Q330 698 368 682" fill="none" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- escape wheel -->
  <circle cx="480" cy="300" r="84" fill="none" stroke="#333" stroke-width="16" stroke-dasharray="5 12"/>
  <circle cx="480" cy="300" r="74" fill="none" stroke="#111" stroke-width="5"/>
  <g stroke="#111" stroke-width="7">
    <line x1="480" y1="230" x2="480" y2="370"/>
    <line x1="410" y1="300" x2="550" y2="300"/>
  </g>
  <circle cx="480" cy="300" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- anchor -->
  <path d="M418 258 L438 214 Q480 192 522 214 L542 258" fill="none" stroke="#222" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="480" cy="205" r="7" fill="#fff" stroke="#111" stroke-width="2"/>

  <!-- 9 -->
  <path d="M452 186 q0 -8 8 -8 h12 q8 0 8 -8 q0 8 8 8 h12 q8 0 8 8" fill="none" stroke="#111" stroke-width="1.6"/>
  <text x="560" y="80">escapement (resembling</text>
  <line x1="580" y1="108" x2="716" y2="108" stroke="#999" stroke-dasharray="2 3"/>
  <text x="720" y="106">)</text>
  <line x1="565" y1="118" x2="492" y2="162" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 10 -->
  <path d="M572 212 q8 0 8 8 v66 q0 8 8 8 q-8 0 -8 8 v66 q0 8 -8 8" fill="none" stroke="#111" stroke-width="1.6"/>
  <text x="604" y="306">the</text>
  <line x1="658" y1="308" x2="790" y2="308" stroke="#999" stroke-dasharray="2 3"/>
  <line x1="600" y1="300" x2="592" y2="300" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 11 -->
  <line x1="600" y1="438" x2="530" y2="372" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="604" y="446">the</text>
  <line x1="658" y1="448" x2="790" y2="448" stroke="#999" stroke-dasharray="2 3"/>

  <!-- 12 / 13 -->
  <path d="M296 330 q-12 0 -12 12 v158 q0 10 -10 10 q10 0 10 10 v158 q0 12 12 12" fill="none" stroke="#111" stroke-width="1.6"/>
  <text x="80" y="490">a</text>
  <line x1="120" y1="492" x2="252" y2="492" stroke="#999" stroke-dasharray="2 3"/>
  <text x="70" y="516">which beats each</text>
  <line x1="214" y1="510" x2="268" y2="510" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="106" y1="544" x2="252" y2="544" stroke="#999" stroke-dasharray="2 3"/>

  <!-- small arc -->
  <line x1="420" y1="700" x2="372" y2="690" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="428" y="712">small arc</text>
</svg>
