<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8efff"/>
      <stop offset="1" stop-color="#d6e2ff"/>
    </linearGradient>
    <linearGradient id="lband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5bff"/>
      <stop offset="1" stop-color="#3b2fd6"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="128" fill="url(#lbg)"/>
  <circle cx="200" cy="150" r="96" stroke="#1d5bff" stroke-opacity=".12" stroke-width="2"/>
  <!-- sound waves -->
  <g stroke="#1d5bff" stroke-linecap="round" stroke-width="6">
    <path d="M70 140v20" stroke-opacity=".35"/>
    <path d="M86 122v56" stroke-opacity=".55"/>
    <path d="M102 132v36" stroke-opacity=".75"/>
    <path d="M298 132v36" stroke-opacity=".75"/>
    <path d="M314 116v68" stroke-opacity=".55"/>
    <path d="M330 138v24" stroke-opacity=".35"/>
  </g>
  <!-- headphones -->
  <path d="M138 168v-26c0-34 28-62 62-62s62 28 62 62v26" stroke="url(#lband)" stroke-width="16" stroke-linecap="round"/>
  <rect x="120" y="150" width="42" height="70" rx="18" fill="#1d5bff"/>
  <rect x="238" y="150" width="42" height="70" rx="18" fill="#3b2fd6"/>
  <rect x="130" y="162" width="14" height="46" rx="7" fill="#fff" fill-opacity=".35"/>
  <rect x="256" y="162" width="14" height="46" rx="7" fill="#fff" fill-opacity=".35"/>
  <!-- music notes -->
  <g fill="#e2263c">
    <circle cx="300" cy="78" r="9"/>
    <rect x="306" y="44" width="5" height="36" rx="2.5"/>
    <path d="M311 44l18 6v10l-18-6z"/>
  </g>
  <g fill="#1d5bff" fill-opacity=".8">
    <circle cx="96" cy="74" r="7"/>
    <rect x="100" y="48" width="4" height="28" rx="2"/>
  </g>
  <circle cx="330" cy="230" r="6" fill="#1d5bff" fill-opacity=".25"/>
  <circle cx="64" cy="220" r="10" fill="#e2263c" fill-opacity=".18"/>
</svg>
