<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111">
  <rect width="960" height="420" fill="#fff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111"/></marker></defs>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="bold">How a caloric-restriction mimetic works</text>

  <text x="480" y="98" text-anchor="middle">CR mimetic</text>
  <line x1="480" y1="108" x2="480" y2="142" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>

  <text x="410" y="168" text-anchor="end">less</text>
  <line x1="418" y1="170" x2="574" y2="170" stroke="#999" stroke-dasharray="2 3"/>
  <text x="582" y="168">is processed</text>
  <line x1="480" y1="182" x2="480" y2="214" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>

  <text x="480" y="242" text-anchor="middle">production of ATP is decreased</text>
  <line x1="462" y1="254" x2="338" y2="290" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="498" y1="254" x2="626" y2="290" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>

  <text x="240" y="320" text-anchor="middle" font-weight="bold">Theory 1:</text>
  <text x="240" y="356" text-anchor="middle">cells less damaged by disease because</text>
  <text x="180" y="394" text-anchor="end">fewer</text>
  <line x1="188" y1="396" x2="344" y2="396" stroke="#999" stroke-dasharray="2 3"/>
  <text x="352" y="394">are emitted</text>

  <text x="715" y="320" text-anchor="middle" font-weight="bold">Theory 2:</text>
  <text x="660" y="356" text-anchor="end">cells focus on</text>
  <line x1="668" y1="358" x2="824" y2="358" stroke="#999" stroke-dasharray="2 3"/>
  <text x="832" y="356">because</text>
  <text x="715" y="394" text-anchor="middle">food is in short supply</text>
</svg>
